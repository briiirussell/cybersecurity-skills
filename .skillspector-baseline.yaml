# SkillSpector baseline for briiirussell/cybersecurity-skills
#
# Every entry below was triaged by hand against a real static scan
# (SkillSpector v2.13.1, `--no-llm`). The skills teach security work, so they quote
# attack payloads, credential file paths and vulnerable code on purpose. Each rule
# says why the match is intentional. See docs/security-scanning.md.
#
# Last re-triaged for v1.19.1 against all 35 skills (221 matches, all intentional).
#
# Format: SkillSpector baseline v2, glob `rules` only (no exact fingerprints, so
# entries survive line shifts). `path` is `<skill>/<file>` (`<skill>/*` for any
# file in that skill). Findings from build-copied shared/ files repeat in every
# skill holding the copy, so those rules use `*` as the skill segment and may only
# target `*/references/<file in shared/>` or `*/SKILL.md`.
#
# SkillSpector reports file paths relative to the skill it scans (`SKILL.md`) and
# rejects --baseline on recursive multi-skill scans, so CI scans one skill at a time
# and `.github/scripts/skillspector-baseline.mjs <skill>` narrows this file to that
# skill's rules (stripping the `<skill>/` prefix). A rule for one skill can never
# suppress a finding in another.
#
# Keep it narrow: always set `id`, `path` and `message`. Never add a rule without a
# `reason`. Values must be double-quoted on one line (the CI splitter reads this
# restricted YAML subset).

version: 2
rules:
  # --- api-audit -----------------------------------------------------------
  - id: "TM1"
    path: "api-audit/SKILL.md"
    message: "*DELETE /admin/users/123*"
    reason: "Example BOLA/BFLA test request the auditor sends to prove a missing role check; documentation, not a tool call"
  - id: "PE3"
    path: "api-audit/SKILL.md"
    message: "*/etc/passwd*"
    reason: "Path-traversal payload shown as the thing to test for in resource IDs; the skill never reads the file"

